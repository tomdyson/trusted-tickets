[project]
name = "trusted-tickets"
version = "1.0.0"
description = "Multi-event ticket booking system with trust-based payments"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.6,<5.3.0",
    "psycopg2-binary>=2.9.9",
    "dj-database-url>=2.1.0",
    "gunicorn>=21.2.0",
    "whitenoise>=6.6.0",
    "any-llm-sdk[all]>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "django-debug-toolbar>=4.2.0",
    "ipython>=8.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.django]
settings-module = "trusted_tickets.settings"
